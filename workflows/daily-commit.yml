name: Daily commit

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make commits
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

          if [ $((RANDOM % 100)) -lt 15 ]; then
            echo "Skip today"
            exit 0
          fi

          COUNT=$((RANDOM % 4 + 1))
          for i in $(seq 1 $COUNT); do
            echo "- $(date -u '+%Y-%m-%d %H:%M:%S') #$i" >> log.md
            git add log.md
            git commit -m "chore: daily log $(date -u '+%Y-%m-%d') ($i/$COUNT)"
          done

          git push
